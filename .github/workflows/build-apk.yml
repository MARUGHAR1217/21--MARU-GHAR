
name: Build Maru Ghar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'admin.html'
      - 'privacy.html'
      - 'download.html'
      - 'firebase-config.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - 'icon.png'
      - 'maru-ghar-approved-app-icon.png'
      - 'maru-ghar-backend.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Maru Ghar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify required files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f index.html
          test -f admin.html
          test -f privacy.html
          test -f download.html
          test -f firebase-config.js
          test -f maru-ghar-approved-app-icon.png

      - name: Install dependencies
        run: npm install

      - name: Prepare approved app icon
        run: |
          mkdir -p assets
          cp maru-ghar-approved-app-icon.png assets/icon.png

      - name: Prepare web files
        run: npm run copy-web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maru-Ghar-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
